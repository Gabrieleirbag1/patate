# Apache -> conteneur Patate (server_patate.sh publie l'app sur 127.0.0.1:8090).
# À copier dans /etc/apache2/sites-available/patate.conf, en remplaçant le ServerName.
# HTTPS : lancer ensuite certbot (--apache), qui crée la version 443 à partir de ce fichier.
<VirtualHost *:80>
    ServerName patate.missclick.net
    # ServerAlias www.patate.missclick.net

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    # Envois de photos : même limite que l'app (64 Mo) et du temps pour les gros fichiers
    LimitRequestBody 67108864
    ProxyTimeout 120

    ErrorLog ${APACHE_LOG_DIR}/patate-error.log
    CustomLog ${APACHE_LOG_DIR}/patate-access.log combined
</VirtualHost>
